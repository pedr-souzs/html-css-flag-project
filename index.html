<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeiras em HTML e CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <div class="pais">

            <h2>França</h2>

            <div class="bandeira franca">

                <div class="faixa azul"></div>
                <div class="faixa branco"></div>
                <div class="faixa vermelho"></div>

            </div>

        </div>

        <div class="pais">

            <h2>Bélgica</h2>

            <div class="bandeira belgica">

                <div class="faixa preto"></div>
                <div class="faixa amarelo"></div>
                <div class="faixa vermelho"></div>

            </div>

        </div>

        <div class="pais">

            <h2>Itália</h2>

            <div class="bandeira italia">

                <div class="faixa verde"></div>
                <div class="faixa branco"></div>
                <div class="faixa vermelho"></div>

            </div>

        </div>

        <div class="pais">

            <h2>Alemanha</h2>

            <div class="bandeira alemanha">

                <div class="faixa preto"></div>
                <div class="faixa vermelho"></div>
                <div class="faixa amarelo"></div>

            </div>

        </div>

        <div class="pais">

            <h2>Rússia</h2>

            <div class="bandeira russia">

                <div class="faixa branco"></div>
                <div class="faixa azul-claro"></div>
                <div class="faixa vermelho"></div>

            </div>

        </div>


    </main>

</body>

</html>
